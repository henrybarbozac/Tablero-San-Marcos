<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de obra · San Marcos</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c2430; --mut:#5d6877; --line:#dfe3e9;
    --ok:#1f7a4d; --ok-bg:#e4f4ea; --warn:#a66300; --warn-bg:#fdf0d5; --bad:#b3261e; --bad-bg:#fbe3e1;
    --gray:#6b7380; --gray-bg:#eceef1; --prog:#5d6877; --ejec:#1456b8; --crit:#c2410c;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#12161c; --card:#1b212a; --ink:#e8ecf2; --mut:#9aa5b4; --line:#2e3744;
      --ok:#58c58d; --ok-bg:#16301f; --warn:#f0b341; --warn-bg:#3a2d10; --bad:#ff8a80; --bad-bg:#40191a;
      --gray:#9aa5b4; --gray-bg:#262d37; --prog:#9aa5b4; --ejec:#6aa6ff; --crit:#ff9a5c;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:1.35rem;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 18px}
  h2{font-size:1.05rem;margin:0 0 10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .lbl{color:var(--mut);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
  .card .val{font-size:2rem;font-weight:700;margin-top:2px}
  .card .nota{color:var(--mut);font-size:.82rem}
  .sem{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:14px;border-left-width:8px}
  .sem .estado{font-size:1.6rem;font-weight:800;padding:4px 14px;border-radius:8px}
  .sem .det{flex:1;min-width:240px}
  .sem .det b{font-weight:700}
  .t-bad{background:var(--bad-bg);color:var(--bad)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-ok{background:var(--ok-bg);color:var(--ok)}
  .sem.bad{border-left-color:var(--bad)} .sem.warn{border-left-color:var(--warn)} .sem.ok{border-left-color:var(--ok)}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.bad td{background:var(--bad-bg)} tr.warn td{background:var(--warn-bg)} tr.ok td{background:transparent}
  tr.gray td{background:var(--gray-bg);color:var(--gray)}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
  .tag.rc{color:var(--crit)}
  .estado-c{font-weight:600}
  tr.bad .estado-c{color:var(--bad)} tr.warn .estado-c{color:var(--warn)} tr.ok .estado-c{color:var(--ok)}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.82rem;margin-top:10px}
  .leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .charts{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-top:14px}
  svg{width:100%;height:auto;display:block}
  svg text{fill:var(--mut);font:11px system-ui,sans-serif}
  svg .grid{stroke:var(--line);stroke-width:1}
  svg .ax{stroke:var(--mut);stroke-width:1}
  .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-top:6px}
  .lg span{display:inline-flex;align-items:center;gap:6px}
  .lg svg{width:26px;height:8px}
  @media (max-width:760px){.grid3{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}

  .cont3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .cont3 .card .val{font-size:1.8rem}
  .cont3 .lib .val{color:var(--ok)} .cont3 .pen .val{color:var(--ink)} .cont3 .ven .val{color:var(--warn)}
  tr.r-lib td{background:var(--ok-bg)} tr.r-ven td{background:var(--warn-bg)} tr.r-res td{background:transparent}
  tr.r-lib .est{color:var(--ok);font-weight:600} tr.r-ven .est{color:var(--warn);font-weight:600} tr.r-res .est{color:var(--mut);font-weight:600}
  td.wrap{white-space:normal;min-width:220px}
  .visor{display:grid;grid-template-columns:1fr 280px;gap:12px}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .filtros label{color:var(--mut);font-size:.85rem}
  select{font:inherit;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .chip{font:inherit;font-size:.82rem;padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .chip[aria-pressed="false"]{opacity:.45}
  #cv{width:100%;height:420px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
  .panel{border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.88rem;align-self:start}
  .panel dt{color:var(--mut);font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;margin-top:8px}
  .panel dd{margin:0;word-break:break-all}
  .panel .vacio{color:var(--mut)}
  .hint{color:var(--mut);font-size:.8rem;margin-top:6px}
  @media (max-width:760px){.cont3{grid-template-columns:1fr}.visor{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="obra"></h1>
  <p class="sub" id="meta"></p>

  <div class="grid3" id="tarjetas"></div>

  <div class="card sem" id="semaforo"></div>

  <div class="card">
    <h2>Avance por partida</h2>
    <div class="tablewrap"><table id="tabla"></table></div>
    <div class="leyenda" id="leyenda"></div>
  </div>

  <div class="charts">
    <div class="card">
      <h2>Curva S · programado y ejecutado</h2>
      <div id="curva"></div>
      <div class="lg" id="lgCurva"></div>
    </div>
    <div class="card">
      <h2>PPC · últimas ocho semanas</h2>
      <div id="ppc"></div>
      <div class="lg" id="lgPpc"></div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Restricciones del lookahead</h2>
    <div class="cont3" id="contR"></div>
    <div class="tablewrap"><table id="tablaR"></table></div>
    <div class="leyenda" id="leyR"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <h2>Visor del modelo por estado</h2>
    <div class="filtros">
      <label for="fNivel">Nivel</label>
      <select id="fNivel"></select>
      <span id="chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
    <div class="visor">
      <canvas id="cv" aria-label="Vista isométrica del modelo, coloreada por estado"></canvas>
      <div class="panel" id="panel"><span class="vacio">Haz clic en un elemento del modelo para ver su detalle.</span></div>
    </div>
    <div class="hint">Vista isométrica ilustrativa, no es un metrado. Los filtros atenúan los elementos que no coinciden.</div>
  </div>
</div>

<script>
/* Reglas de cálculo del avance de obra. Un solo lugar para las cifras: el tablero muestra, no vuelve a calcular.
   1. Programado de una partida: fracción de su plazo transcurrida al corte, entre 0 y 1.
   2. Ejecutado de una partida: metrado ejecutado al corte entre metrado contractual.
   3. Peso: parcial contractual entre el monto de las partidas de control. Nunca promedio simple.
   4. Atraso sin compensar: suma ponderada de lo que cada partida va por debajo de lo programado.
      Un adelanto se informa aparte y nunca se resta.
   5. Una partida que aún no entra en su ventana no tiene brecha: lo ejecutado es trabajo anticipado.
   6. Semáforo: lo decide la ruta crítica. CRÍTICO por encima de 20 pp, EN RIESGO por encima de 10 pp.
   Uso: var r = CALC.resumen(DATOS);  r.total.prog, r.total.ejec, r.total.atraso, r.critica.atraso, r.semaforo.estado */
/* ====== Reglas de cálculo (las mismas de la skill metricas-de-obra): una sola fuente para deck y plataforma ====== */
var CALC = (function () {
  function d(s) { var p = String(s).split('/'); return Date.UTC(+p[2], +p[1] - 1, +p[0]); }
  var DIA = 86400000;
  var UMBRAL_RIESGO = 0.10, UMBRAL_CRITICO = 0.20;

  function avance(partidas, corte) {
    var tot = partidas.reduce(function (s, p) { return s + p.parcial; }, 0);
    return partidas.map(function (p) {
      var ini = d(p.ini), fin = d(p.fin), dur = Math.max(1, (fin - ini) / DIA);
      var prog = Math.max(0, Math.min(1, (corte - ini) / DIA / dur));
      var ejec = p.ej1 / p.met;
      var noProg = ini > corte;
      return {
        item: p.item, nombre: p.nombre, resp: p.resp, critica: p.critica, parcial: p.parcial, peso: p.parcial / tot,
        prog: prog, ejec: ejec, noProg: noProg, brecha: noProg ? null : prog - ejec,
        valorizado: p.ej1 * p.pu, causa: p.causa, ini: p.ini, fin: p.fin
      };
    });
  }
  function agregado(av) {
    var s = av.reduce(function (a, p) { return a + p.parcial; }, 0), r = { prog: 0, ejec: 0, atraso: 0, adelanto: 0, anticipado: 0 };
    av.forEach(function (p) {
      var k = p.parcial / s;
      r.prog += k * p.prog; r.ejec += k * p.ejec;
      if (p.noProg) r.anticipado += k * p.ejec;
      else if (p.brecha > 0) r.atraso += k * p.brecha;
      else r.adelanto += k * (-p.brecha);
    });
    r.neto = r.atraso - r.adelanto; r.dif = r.ejec - r.prog;
    return r;
  }
  function semaforo(av, rc) {
    var cr = av.filter(function (p) { return p.critica && !p.noProg; });
    if (!cr.length) return { estado: 'EN PLAZO', por: null };
    var peor = cr.slice().sort(function (a, b) { return b.brecha - a.brecha; })[0];
    if (rc.atraso > UMBRAL_CRITICO || peor.brecha > UMBRAL_CRITICO) return { estado: 'CRÍTICO', por: peor };
    if (rc.atraso > UMBRAL_RIESGO || peor.brecha > UMBRAL_RIESGO) return { estado: 'EN RIESGO', por: peor };
    return { estado: 'EN PLAZO', por: peor };
  }
  function estadoPartida(p) {
    if (p.noProg) return 'Aún no entra en ventana';
    if (p.brecha > UMBRAL_CRITICO) return 'Crítico';
    if (p.brecha > UMBRAL_RIESGO) return 'En riesgo';
    if (p.brecha < 0) return 'Adelantada';
    return 'En plazo';
  }
  function resumen(datos) {
    var corte = d(datos.obra.corte), av = avance(datos.partidas, corte);
    var tot = agregado(av), cri = agregado(av.filter(function (p) { return p.critica; }));
    var sem = semaforo(av, cri);
    var ppc = datos.ppc[datos.ppc.length - 1];
    var valor = av.reduce(function (s, p) { return s + p.valorizado; }, 0);
    return { av: av, total: tot, critica: cri, semaforo: sem, ppcActual: ppc.ppc, valorizado: valor,
             contractual: datos.partidas.reduce(function (s, p) { return s + p.parcial; }, 0) };
  }
  function pct(x, n) { return (x * 100).toFixed(n === undefined ? 1 : n).replace('.', ','); }
  return { d: d, avance: avance, agregado: agregado, semaforo: semaforo, estadoPartida: estadoPartida, resumen: resumen, pct: pct,
           UMBRAL_RIESGO: UMBRAL_RIESGO, UMBRAL_CRITICO: UMBRAL_CRITICO };
})();

</script>
<script>
(function () {
  var R = CALC.resumen(DATOS), O = DATOS.obra, P = CALC.pct;
  function pp(x) { return P(x).replace('-', '−') + ' pp'; }
  function $(id) { return document.getElementById(id); }
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, txt) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (txt !== undefined) e.textContent = txt;
    if (parent) parent.appendChild(e);
    return e;
  }

  /* Cabecera */
  $('obra').textContent = O.nombre;
  $('meta').textContent = 'Fecha de corte: ' + O.corte + ' · Informe ' + O.informe + ' (' + O.periodo + ') · Día ' + O.dia + ' de ' + O.plazo + ' · ' + O.contratista;

  /* Tarjetas */
  var t = R.total;
  $('tarjetas').innerHTML =
    '<div class="card"><div class="lbl">Avance programado</div><div class="val">' + P(t.prog) + ' %</div><div class="nota">Ponderado por parcial contractual</div></div>' +
    '<div class="card"><div class="lbl">Avance ejecutado</div><div class="val">' + P(t.ejec) + ' %</div><div class="nota">Incluye ' + P(t.anticipado) + ' % de trabajo anticipado</div></div>' +
    '<div class="card"><div class="lbl">Atraso sin compensar</div><div class="val">' + pp(t.atraso) + '</div><div class="nota">Adelanto informado aparte: ' + pp(t.adelanto) + '</div></div>';

  /* Semáforo */
  var s = R.semaforo, cls = s.estado === 'CRÍTICO' ? 'bad' : s.estado === 'EN RIESGO' ? 'warn' : 'ok';
  var sm = $('semaforo'); sm.classList.add(cls);
  sm.innerHTML =
    '<div class="estado t-' + cls + '">' + s.estado + '</div>' +
    '<div class="det">' +
      (s.por ? 'Lo decide la partida <b>' + s.por.nombre + '</b> (' + s.por.item + '), con una brecha de <b>' + pp(s.por.brecha) + '</b>.<br>' : '') +
      'Atraso sin compensar de la ruta crítica: <b>' + pp(R.critica.atraso) + '</b>. ' +
      'Umbrales: riesgo sobre ' + (CALC.UMBRAL_RIESGO * 100) + ' pp, crítico sobre ' + (CALC.UMBRAL_CRITICO * 100) + ' pp. El estado lo decide la ruta crítica, no el promedio.' +
    '</div>';

  /* Tabla */
  var h = '<thead><tr><th>Ítem</th><th>Partida</th><th>Ruta crítica</th><th class="n">Programado</th><th class="n">Ejecutado</th><th class="n">Brecha</th><th>Estado</th></tr></thead><tbody>';
  R.av.forEach(function (p) {
    var c, est = CALC.estadoPartida(p), nota = est;
    if (p.noProg) { c = 'gray'; nota = 'Trabajo anticipado'; }
    else if (est === 'Crítico') c = 'bad';
    else if (est === 'En riesgo') c = 'warn';
    else c = 'ok';
    h += '<tr class="' + c + '"><td>' + p.item + '</td><td>' + p.nombre + '</td>' +
      '<td>' + (p.critica ? '<span class="tag rc">RUTA CRÍTICA</span>' : '') + '</td>' +
      '<td class="n">' + P(p.prog) + ' %</td><td class="n">' + P(p.ejec) + ' %</td>' +
      '<td class="n">' + (p.noProg ? '—' : pp(p.brecha)) + '</td><td class="estado-c">' + nota + '</td></tr>';
  });
  $('tabla').innerHTML = h + '</tbody>';
  $('leyenda').innerHTML =
    '<span><i style="background:var(--bad-bg);border:1px solid var(--bad)"></i>Crítico: brecha sobre ' + (CALC.UMBRAL_CRITICO * 100) + ' pp</span>' +
    '<span><i style="background:var(--warn-bg);border:1px solid var(--warn)"></i>En riesgo: sobre ' + (CALC.UMBRAL_RIESGO * 100) + ' pp</span>' +
    '<span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>En plazo o adelantada</span>' +
    '<span><i style="background:var(--gray-bg);border:1px solid var(--gray)"></i>Aún no entra en su ventana: sin brecha</span>';

  /* Curva S */
  (function () {
    var C = DATOS.curvaS, W = 640, H = 340, m = { l: 40, r: 14, t: 14, b: 34 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var n = C.length, x0 = C[0].sem, x1 = C[n - 1].sem;
    function X(v) { return m.l + (v - x0) / (x1 - x0) * iw; }
    function Y(v) { return m.t + (1 - v / 100) * ih; }
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Curva S: programado y ejecutado, total y ruta crítica' }, $('curva'));
    for (var g = 0; g <= 100; g += 20) {
      el('line', { x1: m.l, x2: W - m.r, y1: Y(g), y2: Y(g), 'class': 'grid' }, svg);
      el('text', { x: m.l - 6, y: Y(g) + 4, 'text-anchor': 'end' }, svg, g + ' %');
    }
    C.forEach(function (d) {
      if ((d.sem - x0) % 2 === 0) el('text', { x: X(d.sem), y: H - 14, 'text-anchor': 'middle' }, svg, 'S' + d.sem);
    });
    el('line', { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), 'class': 'ax' }, svg);
    var corteSem = DATOS.obra.informe;
    el('line', { x1: X(corteSem), x2: X(corteSem), y1: m.t, y2: Y(0), stroke: 'var(--mut)', 'stroke-dasharray': '2 4' }, svg);
    el('text', { x: X(corteSem) - 4, y: m.t + 10, 'text-anchor': 'end' }, svg, 'Corte S' + corteSem);
    function linea(key, color, dash, w) {
      var pts = C.filter(function (d) { return d[key] !== null && d[key] !== undefined; })
                 .map(function (d) { return X(d.sem).toFixed(1) + ',' + Y(d[key]).toFixed(1); });
      el('polyline', { points: pts.join(' '), fill: 'none', stroke: color, 'stroke-width': w, 'stroke-dasharray': dash || '', 'stroke-linejoin': 'round' }, svg);
    }
    linea('progT', 'var(--prog)', '6 4', 2);
    linea('ejecT', 'var(--ejec)', '', 2.5);
    linea('progC', 'var(--crit)', '6 4', 2);
    linea('ejecC', 'var(--crit)', '', 2.5);
    var u = C.filter(function (d) { return d.ejecT !== null; }).pop();
    [['ejecT', 'var(--ejec)'], ['ejecC', 'var(--crit)']].forEach(function (k) {
      el('circle', { cx: X(u.sem), cy: Y(u[k[0]]), r: 4, fill: k[1] }, svg);
      el('text', { x: X(u.sem) + 6, y: Y(u[k[0]]) + 14, 'text-anchor': 'start' }, svg, P(u[k[0]] / 100) + ' %');
    });
    var lg = $('lgCurva');
    [['Total programado', 'var(--prog)', '6 4'], ['Total ejecutado', 'var(--ejec)', ''], ['Ruta crítica programado', 'var(--crit)', '6 4'], ['Ruta crítica ejecutado', 'var(--crit)', '']].forEach(function (k) {
      var sp = document.createElement('span');
      sp.innerHTML = '<svg viewBox="0 0 26 8"><line x1="0" x2="26" y1="4" y2="4" stroke="' + k[1] + '" stroke-width="2.5" stroke-dasharray="' + k[2] + '"/></svg>' + k[0];
      lg.appendChild(sp);
    });
  })();

  /* PPC */
  (function () {
    var D = DATOS.ppc.slice(-8), META = 80, W = 420, H = 340, m = { l: 40, r: 12, t: 16, b: 34 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / D.length;
    function Y(v) { return m.t + (1 - v / 100) * ih; }
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'PPC de las últimas ocho semanas con meta de 80 %' }, $('ppc'));
    for (var g = 0; g <= 100; g += 20) {
      el('line', { x1: m.l, x2: W - m.r, y1: Y(g), y2: Y(g), 'class': 'grid' }, svg);
      el('text', { x: m.l - 6, y: Y(g) + 4, 'text-anchor': 'end' }, svg, g + ' %');
    }
    D.forEach(function (d, i) {
      var x = m.l + i * bw + bw * 0.18, w = bw * 0.64, ok = d.ppc >= META;
      el('rect', { x: x, y: Y(d.ppc), width: w, height: Y(0) - Y(d.ppc), rx: 3, fill: ok ? 'var(--ok)' : 'var(--warn)' }, svg);
      el('text', { x: x + w / 2, y: Y(d.ppc) - 5, 'text-anchor': 'middle', style: 'fill:var(--ink);font-weight:600' }, svg, P(d.ppc / 100) + ' %');
      el('text', { x: x + w / 2, y: H - 14, 'text-anchor': 'middle' }, svg, 'S' + d.sem);
    });
    el('line', { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), 'class': 'ax' }, svg);
    el('line', { x1: m.l, x2: W - m.r, y1: Y(META), y2: Y(META), stroke: 'var(--bad)', 'stroke-width': 1.8, 'stroke-dasharray': '6 4' }, svg);
    el('text', { x: W - m.r, y: Y(META) - 5, 'text-anchor': 'end', style: 'fill:var(--bad);font-weight:600' }, svg, 'Meta ' + META + ' %');
    var lg = $('lgPpc');
    lg.innerHTML = '<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--ok)"></i>Cumple la meta</span>' +
                   '<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--warn)"></i>Bajo la meta</span>';
  })();

  /* Restricciones */
  var RS = DATOS.restricciones.slice().sort(function (a, b) { return a.dias - b.dias; });
  function claseR(r) { return r.estado === 'Liberada' ? 'r-lib' : (r.dias < 7 ? 'r-ven' : 'r-res'); }
  var nLib = RS.filter(function (r) { return r.estado === 'Liberada'; }).length;
  var pend = RS.filter(function (r) { return r.estado !== 'Liberada'; });
  var nVen = pend.filter(function (r) { return r.dias < 7; }).length;
  $('contR').innerHTML =
    '<div class="card lib"><div class="lbl">Liberadas</div><div class="val">' + nLib + '</div></div>' +
    '<div class="card pen"><div class="lbl">Pendientes</div><div class="val">' + pend.length + '</div></div>' +
    '<div class="card ven"><div class="lbl">Vencen en menos de 7 días</div><div class="val">' + nVen + '</div></div>';
  var hr = '<thead><tr><th>Id</th><th>Restricción</th><th>Partida</th><th>Responsable</th><th>Fecha requerida</th><th class="n">Días</th><th>Estado</th></tr></thead><tbody>';
  RS.forEach(function (r) {
    hr += '<tr class="' + claseR(r) + '"><td>' + r.id + '</td><td class="wrap">' + r.desc + '</td><td>' + r.partida + '</td><td>' + r.resp + '</td><td>' + r.req + '</td><td class="n">' + r.dias + '</td><td class="est">' + (r.estado === 'Liberada' ? 'Liberada' : (r.dias < 7 ? 'Pendiente · vence pronto' : 'Pendiente')) + '</td></tr>';
  });
  $('tablaR').innerHTML = hr + '</tbody>';
  $('leyR').innerHTML =
    '<span><i style="background:var(--ok-bg);border:1px solid var(--ok)"></i>Liberada</span>' +
    '<span><i style="background:var(--warn-bg);border:1px solid var(--warn)"></i>Pendiente que vence en menos de 7 días</span>' +
    '<span><i style="border:1px solid var(--line)"></i>Resto de pendientes</span>' +
    '<span>Ordenadas por días para la fecha requerida</span>';

  /* Visor del modelo */
  (function () {
    var M = MODELO_DATA, E = M.elementos, ST = M.estados, cv = $('cv'), ctx = cv.getContext('2d');
    var partNom = {}; DATOS.partidas.forEach(function (p) { partNom[p.item] = p.nombre; });
    var selNivel = 'todos', selEst = {}, sel = null, items = [], scale = 1, ox = 0, oy = 0, cw = 0, ch = 0;
    Object.keys(ST).forEach(function (k) { selEst[k] = true; });

    function pr(x, y, z) { return [(x - y) * 0.866, (x + y) * 0.5 - z]; }
    items = E.map(function (e, i) {
      var b = e.caja, x0 = b[0], y0 = b[1], z0 = b[2], x1 = b[3], y1 = b[4], z1 = b[5];
      return { e: e, depth: (x0 + x1 + y0 + y1 + z0 + z1) / 2,
        top: [pr(x0, y0, z1), pr(x1, y0, z1), pr(x1, y1, z1), pr(x0, y1, z1)],
        dcha: [pr(x1, y0, z1), pr(x1, y1, z1), pr(x1, y1, z0), pr(x1, y0, z0)],
        izq: [pr(x0, y1, z1), pr(x1, y1, z1), pr(x1, y1, z0), pr(x0, y1, z0)] };
    }).sort(function (a, b) { return a.depth - b.depth; });
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    items.forEach(function (it) { it.top.concat(it.dcha, it.izq).forEach(function (q) {
      minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }); });

    function visible(e) { return (selNivel === 'todos' || String(e.nivel) === selNivel) && selEst[e.estado]; }
    function tr(q) { return [q[0] * scale + ox, q[1] * scale + oy]; }
    function poly(pts, fill, stroke, lw) {
      ctx.beginPath(); pts.forEach(function (q, i) { var t = tr(q); i ? ctx.lineTo(t[0], t[1]) : ctx.moveTo(t[0], t[1]); }); ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
    }
    function resize() {
      var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      cw = r.width; ch = r.height; cv.width = Math.round(cw * d); cv.height = Math.round(ch * d); ctx.setTransform(d, 0, 0, d, 0, 0);
      scale = Math.min((cw - 30) / (maxX - minX), (ch - 30) / (maxY - minY));
      ox = (cw - (maxX - minX) * scale) / 2 - minX * scale; oy = (ch - (maxY - minY) * scale) / 2 - minY * scale;
      draw();
    }
    function shade(hex, f) {
      var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      function c(v) { return Math.max(0, Math.min(255, Math.round(v * f))); } return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
    }
    function draw() {
      ctx.clearRect(0, 0, cw, ch);
      items.forEach(function (it) {
        var col = ST[it.e.estado].c, on = visible(it.e);
        ctx.globalAlpha = on ? 1 : 0.1;
        poly(it.izq, shade(col, 0.78), 'rgba(0,0,0,.35)', 0.7);
        poly(it.dcha, shade(col, 0.6), 'rgba(0,0,0,.35)', 0.7);
        poly(it.top, shade(col, 1.08), 'rgba(0,0,0,.35)', 0.7);
      });
      ctx.globalAlpha = 1;
      if (sel) { poly(sel.top, null, '#000', 2.5); poly(sel.dcha, null, '#000', 2.5); poly(sel.izq, null, '#000', 2.5); }
    }
    function dentro(pts, x, y) {
      var ins = false, n = pts.length;
      for (var i = 0, j = n - 1; i < n; j = i++) {
        var a = tr(pts[i]), b = tr(pts[j]);
        if (((a[1] > y) !== (b[1] > y)) && (x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0])) ins = !ins;
      } return ins;
    }
    function pick(x, y) {
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i]; if (!visible(it.e)) continue;
        if (dentro(it.top, x, y) || dentro(it.dcha, x, y) || dentro(it.izq, x, y)) return it;
      } return null;
    }
    function detalle() {
      var pn = $('panel');
      if (!sel) { pn.innerHTML = '<span class="vacio">Haz clic en un elemento del modelo para ver su detalle.</span>'; return; }
      var e = sel.e, bloq = e.enlace ? e.enlace : 'Ninguna';
      var idm = /^R-\d+/.exec(e.enlace || ''), extra = '';
      if (idm) { var rr = DATOS.restricciones.filter(function (r) { return r.id === idm[0]; })[0];
        if (rr) extra = '<br><span class="vacio">Responsable: ' + rr.resp + ' · requerida ' + rr.req + '</span>'; }
      pn.innerHTML = '<b>' + e.nombre + '</b> <span class="vacio">(' + e.tipoIfc + ')</span>' +
        '<dl><dt>GlobalId</dt><dd>' + e.globalId + '</dd>' +
        '<dt>Nivel</dt><dd>' + e.nivel + '</dd>' +
        '<dt>Partida</dt><dd>' + e.partida + ' · ' + (partNom[e.partida] || '') + '</dd>' +
        '<dt>Estado</dt><dd><i style="display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;background:' + ST[e.estado].c + '"></i>' + ST[e.estado].n + '</dd>' +
        '<dt>Restricción que lo bloquea</dt><dd>' + bloq + extra + '</dd></dl>';
    }
    cv.addEventListener('click', function (ev) {
      var r = cv.getBoundingClientRect(); sel = pick(ev.clientX - r.left, ev.clientY - r.top); draw(); detalle();
    });
    /* Filtros */
    var fn = $('fNivel'), niveles = []; E.forEach(function (e) { if (niveles.indexOf(e.nivel) < 0) niveles.push(e.nivel); }); niveles.sort();
    fn.innerHTML = '<option value="todos">Todos</option>' + niveles.map(function (n) { return '<option value="' + n + '">Nivel ' + n + '</option>'; }).join('');
    fn.addEventListener('change', function () { selNivel = fn.value; if (sel && !visible(sel.e)) { sel = null; detalle(); } draw(); });
    var chips = $('chips');
    Object.keys(ST).forEach(function (k) {
      var n = E.filter(function (e) { return e.estado === k; }).length, b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'true');
      b.innerHTML = '<i style="background:' + ST[k].c + '"></i>' + ST[k].n + ' (' + n + ')';
      b.addEventListener('click', function () {
        selEst[k] = !selEst[k]; b.setAttribute('aria-pressed', selEst[k]); if (sel && !visible(sel.e)) { sel = null; detalle(); } draw();
      });
      chips.appendChild(b);
    });
    window.addEventListener('resize', resize);
    window.TABLERO = { posElemento: function (nombre) { var it = items.filter(function (i) { return i.e.nombre === nombre; })[0], q = it.top.concat(it.dcha, it.izq), sx = 0, sy = 0;
      q.forEach(function (p) { var t = tr(p); sx += t[0]; sy += t[1]; }); var r = cv.getBoundingClientRect(); return [r.left + sx / q.length, r.top + sy / q.length]; } };
    resize();
  })();
})();
</script>
